name: Diploman Ticker Feed Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'nov2026/master-data.json'
      - 'update-ticker.js'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours

jobs:
  build-ticker:
  
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Ticker Update Script
      run: node update-ticker.js

    - name: Commit and push generated ticker feed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/live-ticker-feed.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated live ticker feed update [skip ci]" && git push)
