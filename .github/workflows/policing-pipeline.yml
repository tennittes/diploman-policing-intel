name: Diploman Policing Intel Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-policing-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push generated updates back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            npm install @google/genai
          fi

      - name: Execute Extraction & Telemetry Scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data
          node scripts/update-policing.js

      - name: Commit & Push Master Data & Ticker Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "*202*/master-data.json" data/live-ticker-feed.json data/incoming-police-raw.txt || true
          git status
          if ! git diff --staged --quiet; then
            git commit -m "chore: automated daily policing intel telemetry update (B4 format) [skip ci]"
            git push
          else
            echo "No telemetry or ticker changes to commit."
          fi
